name: Deploy to AWS Lambda

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies & package code
        run: |
          python -m pip install --upgrade pip
          mkdir artifact
          pip install -r requirements.txt -t artifact/
          cp -r src artifact/
          cp -r app.py artifact/
          cd artifact && zip -r ../deployment_package.zip .

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload package to S3
        run: |
          aws s3 cp deployment_package.zip s3://stock-market-monitor-deployments/deployment_package.zip

      - name: Deploy to AWS Lambda
        run: |
          aws lambda update-function-code \
            --function-name stock-market-monitor \
            --s3-bucket stock-market-monitor-deployments \
            --s3-key deployment_package.zip