[project]
name = "stock-market-monitor"
version = "0.1.0"
description = "Serverless market-scanning pipeline that runs technical indicators and sends alerts to Telegram."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yfinance>=0.2.30",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
